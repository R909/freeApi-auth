<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch API Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      :root {
        --bg: #f6fff7;
        --surface: #ffffff;
        --surface-2: #fbfff9;
        --line: #d9ead8;
        --ink: #284336;
        --muted: #6d8a78;
        --green: #63bf74;
        --green-2: #b6e98f;
        --sun: #ffe58f;
        --shadow: 0 20px 54px rgba(55, 101, 67, 0.12);
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 12% 10%,
            rgba(255, 255, 255, 0.96),
            transparent 22%
          ),
          radial-gradient(
            circle at 82% 14%,
            rgba(182, 233, 143, 0.3),
            transparent 20%
          ),
          radial-gradient(
            circle at 78% 82%,
            rgba(99, 191, 116, 0.16),
            transparent 18%
          ),
          linear-gradient(145deg, #fdfff9, var(--bg));
        overflow: auto;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(46, 139, 87, 0.08),
            transparent 16%
          ),
          radial-gradient(
            circle at 82% 76%,
            rgba(255, 216, 106, 0.08),
            transparent 18%
          );
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: -4vh;
        height: 30vh;
        background:
          linear-gradient(
            180deg,
            rgba(99, 191, 116, 0) 0%,
            rgba(99, 191, 116, 0.1) 22%,
            rgba(46, 139, 87, 0.24) 100%
          ),
          radial-gradient(
            ellipse at 25% 25%,
            rgba(182, 233, 143, 0.18),
            transparent 40%
          ),
          radial-gradient(
            ellipse at 75% 20%,
            rgba(255, 229, 143, 0.16),
            transparent 34%
          );
        pointer-events: none;
      }

      .stage {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .ambient {
        position: fixed;
        left: 6%;
        bottom: 10%;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 229, 143, 0.24),
          rgba(255, 229, 143, 0) 68%
        );
        filter: blur(8px);
        pointer-events: none;
        animation: float 9s ease-in-out infinite;
      }

      .card {
        width: min(1140px, 100%);
        min-height: min(720px, calc(100vh - 48px));
        display: grid;
        grid-template-columns: minmax(320px, 0.92fr) minmax(360px, 1.08fr);
        border-radius: 34px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.8);
        animation: rise 0.7s ease both;
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: auto 24px 20px 24px;
        height: 18px;
        border-radius: 999px;
        background: rgba(46, 139, 87, 0.08);
        filter: blur(10px);
        z-index: -1;
      }

      /* ── ART PANEL ── */
      .art {
        position: relative;
        padding: 34px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.1),
            rgba(255, 255, 255, 0.03)
          ),
          linear-gradient(160deg, #7dd38b 0%, #95d67a 44%, #c7ef95 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        filter: blur(0.2px);
        animation: cloudDrift 18s linear infinite;
        pointer-events: none;
      }
      .cloud.c1 {
        top: 36px;
        left: 30px;
        width: 84px;
        height: 24px;
      }
      .cloud.c1::before,
      .cloud.c1::after,
      .cloud.c2::before,
      .cloud.c2::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 999px;
      }
      .cloud.c1::before {
        width: 28px;
        height: 28px;
        left: 10px;
        top: -10px;
      }
      .cloud.c1::after {
        width: 34px;
        height: 34px;
        left: 32px;
        top: -14px;
      }
      .cloud.c2 {
        top: 96px;
        right: 44px;
        width: 64px;
        height: 18px;
        animation-duration: 22s;
        opacity: 0.9;
      }
      .cloud.c2::before {
        width: 20px;
        height: 20px;
        left: 8px;
        top: -8px;
      }
      .cloud.c2::after {
        width: 24px;
        height: 24px;
        left: 24px;
        top: -10px;
      }

      .dot {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        animation: twinkle 5.5s ease-in-out infinite;
      }
      .dot.d1 {
        width: 6px;
        height: 6px;
        top: 52px;
        left: 74px;
      }
      .dot.d2 {
        width: 4px;
        height: 4px;
        top: 82px;
        right: 96px;
        animation-delay: 1.2s;
      }
      .dot.d3 {
        width: 5px;
        height: 5px;
        top: 136px;
        left: 108px;
        animation-delay: 2s;
      }

      .bird {
        position: absolute;
        width: 18px;
        height: 10px;
        border-top: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50% 50% 0 0;
        opacity: 0.8;
        pointer-events: none;
        animation: birdFly 16s linear infinite;
      }
      .bird::before,
      .bird::after {
        content: "";
        position: absolute;
        top: -1px;
        width: 10px;
        height: 8px;
        border-top: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50% 50% 0 0;
      }
      .bird::before {
        left: -7px;
        transform: rotate(-24deg);
      }
      .bird::after {
        right: -7px;
        transform: rotate(24deg);
      }
      .bird.b1 {
        top: 58px;
        left: 150px;
        animation-duration: 18s;
      }
      .bird.b2 {
        top: 92px;
        left: 78px;
        animation-duration: 21s;
        animation-delay: 2s;
        opacity: 0.72;
      }
      .bird.b3 {
        top: 70px;
        right: 112px;
        animation-duration: 24s;
        animation-delay: 4s;
        opacity: 0.66;
      }

      .art::before {
        content: "";
        position: absolute;
        inset: -18% auto auto -8%;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.24),
          transparent 64%
        );
        filter: blur(8px);
        pointer-events: none;
      }
      .art::after {
        content: "";
        position: absolute;
        inset: auto -8% -16% auto;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 229, 143, 0.34),
          transparent 66%
        );
        filter: blur(10px);
        pointer-events: none;
      }

      .leaf {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 0 100% 0 100%;
        background: linear-gradient(
          135deg,
          rgba(182, 233, 143, 0.88),
          rgba(94, 166, 95, 0.92)
        );
        opacity: 0.35;
        filter: blur(0.2px);
        animation: sway 7s ease-in-out infinite;
      }
      .leaf.l1 {
        top: 22px;
        right: 42px;
        transform: rotate(28deg);
      }
      .leaf.l2 {
        bottom: 44px;
        left: -24px;
        transform: rotate(-18deg);
        animation-duration: 8.5s;
      }
      .leaf.l3 {
        top: 200px;
        left: 64px;
        width: 78px;
        height: 78px;
        transform: rotate(14deg);
        animation-duration: 9s;
      }

      .art-head {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 12px;
      }

      .tag {
        width: max-content;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.1);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
      }

      .art-head h1 {
        margin: 0;
        font-family: "Baloo 2", cursive;
        font-size: clamp(3rem, 7vw, 5.9rem);
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .art-head h1 span {
        display: block;
        color: #fffbe0;
      }
      .art-head p {
        margin: 0;
        max-width: 18ch;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.7;
        font-size: 17px;
      }

      .scene {
        position: relative;
        z-index: 1;
        width: 100%;
        aspect-ratio: 1;
        max-width: 300px;
        margin-left: auto;
        border-radius: 30px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.28),
            rgba(255, 255, 255, 0.08)
          ),
          rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .sun {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.7),
          rgba(255, 229, 143, 0.36) 50%,
          rgba(255, 229, 143, 0) 72%
        );
        animation: float 7s ease-in-out infinite;
      }
      .hill {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -18px;
        height: 40px;
        border-radius: 999px 999px 0 0;
      }
      .hill-1 {
        bottom: 0;
        height: 54px;
        background: linear-gradient(
          180deg,
          rgba(99, 191, 116, 0.2),
          rgba(46, 139, 87, 0.48)
        );
      }
      .hill-2 {
        bottom: 18px;
        height: 30px;
        left: 12%;
        right: 8%;
        background: linear-gradient(
          180deg,
          rgba(182, 233, 143, 0.26),
          rgba(99, 191, 116, 0.32)
        );
      }
      .scene::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .scene::after {
        content: "";
        position: absolute;
        inset: auto 16px 16px;
        height: 28%;
        border-radius: 999px;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.12),
          transparent 72%
        );
        opacity: 0.5;
      }
      .scene-svg {
        width: 74%;
        max-width: 220px;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.18));
        animation: float 6s ease-in-out infinite;
        position: relative;
        z-index: 1;
      }

      /* ── FORM PANEL ── */
      .form {
        padding: 30px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.99),
          rgba(251, 255, 249, 0.98)
        );
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
      }

      .form-head {
        display: grid;
        gap: 8px;
      }
      .form-head h2 {
        margin: 0;
        font-family: "Baloo 2", cursive;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1;
      }
      .form-head p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      /* Message */
      .message {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        display: none;
      }
      .message.show {
        display: block;
      }
      .message.error {
        background: #fff0f0;
        color: #c0392b;
        border: 1px solid #f5c6cb;
      }
      .message.success {
        background: #f0fff4;
        color: #27ae60;
        border: 1px solid #b2dfdb;
      }

      /* Tabs */
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 8px;
        border-radius: 18px;
        background: var(--surface-2);
        border: 1px solid var(--line);
      }
      .tab {
        border: 0;
        border-radius: 14px;
        padding: 13px 14px;
        background: transparent;
        color: var(--muted);
        font:
          800 13px/1 "Inter",
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s,
          color 0.2s,
          box-shadow 0.2s;
      }
      .tab:hover {
        transform: translateY(-1px);
      }
      .tab.active {
        background: #fff;
        color: var(--green);
        box-shadow: 0 10px 18px rgba(99, 191, 116, 0.1);
      }

      /* Panels */
      .panel {
        padding: 18px;
        border-radius: 24px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .hidden {
        display: none !important;
      }

      /* Fields */
      .field {
        display: grid;
        gap: 7px;
        margin-top: 14px;
      }
      .field label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 15px;
        background: var(--surface);
        color: var(--ink);
        outline: none;
        font:
          400 15px/1.2 "Inter",
          system-ui,
          sans-serif;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
        appearance: none;
      }
      .input:focus {
        border-color: #b6e98f;
        box-shadow: 0 0 0 4px rgba(99, 191, 116, 0.12);
        transform: translateY(-1px);
      }
      .input.is-valid {
        border-color: #9ed7aa;
        box-shadow: 0 0 0 3px rgba(99, 191, 116, 0.08);
      }
      .input.is-invalid {
        border-color: #d98b94;
        box-shadow: 0 0 0 3px rgba(194, 95, 104, 0.08);
      }
      .field-error {
        min-height: 16px;
        margin: 0;
        color: #c25f68;
        font-size: 12px;
        line-height: 1.35;
      }

      /* Buttons */
      .action-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }
      .action-row .btn {
        margin-top: 0;
        flex: 1;
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        cursor: pointer;
        background: linear-gradient(135deg, #6cc77c, #b6e98f);
        color: #fff;
        font:
          800 13px/1 "Inter",
          system-ui,
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 0 14px 24px rgba(99, 191, 116, 0.18);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          filter 0.2s,
          opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 28px rgba(99, 191, 116, 0.22);
        filter: saturate(1.03);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        box-shadow: none;
        transform: none;
        filter: none;
      }
      .btn.secondary {
        background: #fff;
        color: var(--green);
        border: 1px solid rgba(71, 179, 111, 0.18);
        box-shadow: none;
      }
      .btn.secondary:hover {
        box-shadow: 0 10px 18px rgba(99, 191, 116, 0.12);
      }

      /* Spinner */
      .spinner {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 0.65s linear infinite;
        flex-shrink: 0;
      }
      .btn.secondary .spinner {
        border-color: rgba(99, 191, 116, 0.3);
        border-top-color: var(--green);
      }

      /* Buddy */
      .buddy {
        width: 54px;
        height: 54px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #fff, #eefaf1);
        border: 1px solid var(--line);
        box-shadow: 0 10px 18px rgba(44, 93, 63, 0.08);
      }
      .buddy svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      /* Profile */
      .profile {
        display: grid;
        gap: 16px;
      }
      .profile-top {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, #6cc77c, #b6e98f);
        font-family: "Baloo 2", cursive;
        font-size: 24px;
        box-shadow: 0 12px 24px rgba(99, 191, 116, 0.16);
        flex-shrink: 0;
      }
      .profile-top strong {
        display: block;
        font-family: "Baloo 2", cursive;
        font-size: 22px;
      }
      .profile-top span {
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .item {
        padding: 14px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid var(--line);
      }
      .item.wide {
        grid-column: 1/-1;
      }
      .item label {
        display: block;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .item span {
        word-break: break-word;
        font-size: 15px;
      }

      /* Responsive */
      @media (max-width: 960px) {
        .card {
          grid-template-columns: 1fr;
          min-height: auto;
        }
        .scene {
          margin-left: 0;
        }
      }
      @media (max-width: 640px) {
        .stage {
          padding: 14px;
        }
        .art,
        .form {
          padding: 20px;
        }
        .card {
          border-radius: 26px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .item.wide {
          grid-column: auto;
        }
        .scene {
          max-width: 220px;
        }
        .action-row {
          flex-direction: column;
          align-items: stretch;
        }
        .buddy {
          align-self: flex-end;
        }
      }

      /* Animations */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(0deg) translateY(0);
        }
        50% {
          transform: rotate(4deg) translateY(-6px);
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.5);
        }
      }
      @keyframes cloudDrift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(60px);
        }
      }
      @keyframes birdFly {
        0% {
          transform: translateX(-40px) translateY(0) scale(0.95);
        }
        50% {
          transform: translateX(160px) translateY(-8px) scale(1);
        }
        100% {
          transform: translateX(360px) translateY(0) scale(0.95);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="ambient"></div>
      <section class="card">
        <!-- ── ART SIDE ── -->
        <aside class="art">
          <span class="bird b1"></span>
          <span class="bird b2"></span>
          <span class="bird b3"></span>
          <span class="cloud c1"></span>
          <span class="cloud c2"></span>
          <span class="dot d1"></span>
          <span class="dot d2"></span>
          <span class="dot d3"></span>
          <span class="leaf l1"></span>
          <span class="leaf l2"></span>
          <span class="leaf l3"></span>

          <div class="art-head">
            <div class="tag">Storybook Jungle</div>
            <h1>Fetch <span>API</span></h1>
            <p>A tiny jungle story for sign up and sign in.</p>
          </div>

          <div class="scene" aria-hidden="true">
            <div class="sun"></div>
            <div class="hill hill-1"></div>
            <div class="hill hill-2"></div>
            <svg viewBox="0 0 320 240" class="scene-svg">
              <ellipse
                cx="160"
                cy="210"
                rx="98"
                ry="18"
                fill="rgba(0,0,0,.16)"
              />
              <path
                d="M44 168 Q86 100 134 122 Q108 160 44 168Z"
                fill="#63bf74"
              />
              <path
                d="M92 172 Q126 92 182 116 Q156 162 92 172Z"
                fill="#82cf67"
              />
              <path
                d="M160 170 Q200 104 266 124 Q238 162 160 170Z"
                fill="#b6e98f"
              />
              <rect
                x="149"
                y="112"
                width="14"
                height="82"
                rx="7"
                fill="#9a6b43"
              />
              <path
                d="M156 144 Q126 160 104 188"
                fill="none"
                stroke="#9a6b43"
                stroke-width="9"
                stroke-linecap="round"
              />
              <path
                d="M158 150 Q186 166 206 190"
                fill="none"
                stroke="#9a6b43"
                stroke-width="8"
                stroke-linecap="round"
              />
              <ellipse cx="160" cy="144" rx="28" ry="22" fill="#f7e1bf" />
              <circle cx="150" cy="140" r="4.2" fill="#284336" />
              <circle cx="170" cy="140" r="4.2" fill="#284336" />
              <path
                d="M154 155 Q160 160 166 155"
                fill="none"
                stroke="#284336"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <circle cx="112" cy="200" r="14" fill="#8ad57c" />
              <circle cx="216" cy="198" r="14" fill="#8ad57c" />
            </svg>
          </div>
        </aside>

        <!-- ── FORM SIDE ── -->
        <section class="form">
          <div class="form-head">
            <h2>Account</h2>
            <p>Register, login, and see the current user.</p>
          </div>

          <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="tabs" id="tabBar">
            <button type="button" class="tab active" data-tab="register">
              Register
            </button>
            <button type="button" class="tab" data-tab="login">Login</button>
          </div>

          <!-- REGISTER -->
          <section id="registerSection" class="panel">
            <div class="field">
              <label for="regUsername">Username</label>
              <input
                id="regUsername"
                class="input"
                placeholder="doejohn"
                autocomplete="username"
              />
              <p class="field-error" id="regUsernameError"></p>
            </div>
            <div class="field">
              <label for="regEmail">Email</label>
              <input
                id="regEmail"
                class="input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />
              <p class="field-error" id="regEmailError"></p>
            </div>
            <div class="field">
              <label for="regPassword">Password</label>
              <input
                id="regPassword"
                class="input"
                type="password"
                placeholder="Min 8 chars, A-z, 0-9, @$!%*?&"
                autocomplete="new-password"
              />
              <p class="field-error" id="regPasswordError"></p>
            </div>
            <div class="field">
              <label for="regRole">Role</label>
              <select id="regRole" class="input">
                <option value="" disabled selected>Select a role</option>
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
              </select>
              <p class="field-error" id="regRoleError"></p>
            </div>
            <div class="action-row">
              <button id="registerBtn" type="button" class="btn">
                Register
              </button>
              <div class="buddy" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                  <path d="M20 24 L13 12 L25 18 Z" fill="#63bf74" />
                  <path d="M44 24 L51 12 L39 18 Z" fill="#63bf74" />
                  <circle cx="32" cy="35" r="18" fill="#8ad57c" />
                  <circle cx="26" cy="32" r="2.2" fill="#284336" />
                  <circle cx="38" cy="32" r="2.2" fill="#284336" />
                  <path
                    d="M28 39 Q32 42 36 39"
                    fill="none"
                    stroke="#284336"
                    stroke-width="2.2"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>
          </section>

          <!-- LOGIN -->
          <section id="loginSection" class="panel hidden">
            <div class="field">
              <label for="loginUsername">Username</label>
              <input
                id="loginUsername"
                class="input"
                placeholder="doejohn"
                autocomplete="username"
              />
              <p class="field-error" id="loginUsernameError"></p>
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <p class="field-error" id="loginPasswordError"></p>
            </div>
            <div class="action-row">
              <button id="loginBtn" type="button" class="btn">Sign In</button>
              <div class="buddy" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                  <path d="M20 24 L13 12 L25 18 Z" fill="#63bf74" />
                  <path d="M44 24 L51 12 L39 18 Z" fill="#63bf74" />
                  <circle cx="32" cy="35" r="18" fill="#8ad57c" />
                  <circle cx="26" cy="32" r="2.2" fill="#284336" />
                  <circle cx="38" cy="32" r="2.2" fill="#284336" />
                  <path
                    d="M28 39 Q32 42 36 39"
                    fill="none"
                    stroke="#284336"
                    stroke-width="2.2"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>
          </section>

          <!-- PROFILE -->
          <section id="profileSection" class="panel hidden">
            <div class="profile">
              <div class="profile-top">
                <div id="avatar" class="avatar">A</div>
                <div>
                  <strong id="profileName">Guest</strong>
                  <span id="profileRole">Not signed in</span>
                </div>
              </div>
              <div class="grid">
                <div class="item">
                  <label>Username</label><span id="profileUsername">-</span>
                </div>
                <div class="item">
                  <label>Email</label><span id="profileEmail">-</span>
                </div>
                <div class="item">
                  <label>Role</label><span id="profileUserRole">-</span>
                </div>
                <div class="item">
                  <label>Verified</label><span id="profileVerified">-</span>
                </div>
                <div class="item wide">
                  <label>User ID</label><span id="profileId">-</span>
                </div>
              </div>
              <button id="logoutBtn" type="button" class="btn secondary">
                Logout
              </button>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script>
      // ==============================================
      // API LAYER  (was api.js)
      // FIX: added credentials:'include' to login &
      //      current-user so cookies are sent/stored
      // ==============================================
      const BASE_URL = "/api/v1/users";

      async function handleResponse(res) {
        let data;
        try {
          data = await res.json();
        } catch {
          data = {};
        }
        if (!res.ok)
          return {
            success: false,
            message: data.message || `Error ${res.status}`,
          };
        return { success: true, data: data.data ?? data };
      }

      async function registerUser(payload) {
        const res = await fetch(`${BASE_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload),
        });
        return handleResponse(res);
      }

      async function loginUser(payload) {
        const res = await fetch(`${BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload),
        });
        return handleResponse(res);
      }

      async function logoutUser() {
        const res = await fetch(`${BASE_URL}/logout`, {
          method: "POST",
          credentials: "include",
        });
        return handleResponse(res);
      }

      async function getCurrentUser() {
        const res = await fetch(`${BASE_URL}/current-user`, {
          credentials: "include",
        });
        return handleResponse(res);
      }

      // ==============================================
      document.addEventListener("DOMContentLoaded", () => {
        // ── Elements ────────────────────────────────
        const registerBtn = document.getElementById("registerBtn");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const messageBox = document.getElementById("message");
        const registerSection = document.getElementById("registerSection");
        const loginSection = document.getElementById("loginSection");
        const profileSection = document.getElementById("profileSection");
        const tabBar = document.getElementById("tabBar");
        const tabs = tabBar.querySelectorAll(".tab");

        const regUsername = document.getElementById("regUsername");
        const regEmail = document.getElementById("regEmail");
        const regPassword = document.getElementById("regPassword");
        const regRole = document.getElementById("regRole");
        const loginUsername = document.getElementById("loginUsername");
        const loginPassword = document.getElementById("loginPassword");

        // ── Message ──────────────────────────────────
        function showMessage(msg, type = "error") {
          messageBox.textContent = msg;
          messageBox.className = `message show ${type}`;
          clearTimeout(messageBox._t);
          messageBox._t = setTimeout(
            () => messageBox.classList.remove("show"),
            5000,
          );
        }

        // ── Field helpers ─────────────────────────────
        function setError(input, errId, msg) {
          input.classList.add("is-invalid");
          input.classList.remove("is-valid");
          document.getElementById(errId).textContent = msg;
        }
        function clearErr(input, errId) {
          input.classList.remove("is-invalid");
          input.classList.add("is-valid");
          document.getElementById(errId).textContent = "";
        }

        // ── Validators ────────────────────────────────
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const PASS_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

        function validateRegUsername() {
          const v = regUsername.value.trim();
          if (!v) {
            setError(regUsername, "regUsernameError", "Username is required");
            return false;
          }
          if (v.length < 3) {
            setError(regUsername, "regUsernameError", "Min 3 characters");
            return false;
          }
          clearErr(regUsername, "regUsernameError");
          return true;
        }
        function validateRegEmail() {
          const v = regEmail.value.trim();
          if (!v) {
            setError(regEmail, "regEmailError", "Email is required");
            return false;
          }
          if (!EMAIL_RE.test(v)) {
            setError(regEmail, "regEmailError", "Invalid email format");
            return false;
          }
          clearErr(regEmail, "regEmailError");
          return true;
        }
        function validateRegPassword() {
          const v = regPassword.value;
          if (!v) {
            setError(regPassword, "regPasswordError", "Password is required");
            return false;
          }
          if (!PASS_RE.test(v)) {
            setError(
              regPassword,
              "regPasswordError",
              "Min 8 chars, upper, lower, number & special (@$!%*?&)",
            );
            return false;
          }
          clearErr(regPassword, "regPasswordError");
          return true;
        }
        function validateRegRole() {
          if (!regRole.value) {
            setError(regRole, "regRoleError", "Please select a role");
            return false;
          }
          clearErr(regRole, "regRoleError");
          return true;
        }

        // live validation
        regUsername.addEventListener("input", validateRegUsername);
        regEmail.addEventListener("input", validateRegEmail);
        regPassword.addEventListener("input", validateRegPassword);
        regRole.addEventListener("change", validateRegRole);

        // ── Tab switching ─────────────────────────────
        // FIX: also hide profileSection when switching tabs
        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            tabs.forEach((t) => t.classList.remove("active"));
            tab.classList.add("active");
            const target = tab.dataset.tab;
            registerSection.classList.toggle("hidden", target !== "register");
            loginSection.classList.toggle("hidden", target !== "login");
            profileSection.classList.add("hidden");
          });
        });

        // ── Loading state ─────────────────────────────
        function setLoading(btn, on, defaultLabel) {
          btn.disabled = on;
          if (on) {
            btn.innerHTML = `<span class="spinner"></span> ${defaultLabel}ing…`;
          } else {
            btn.textContent = defaultLabel;
          }
        }

        // ── REGISTER ──────────────────────────────────
        registerBtn.addEventListener("click", async () => {
          const ok = [
            validateRegUsername(),
            validateRegEmail(),
            validateRegPassword(),
            validateRegRole(),
          ].every(Boolean);
          if (!ok) {
            showMessage("Please fix the errors above.", "error");
            return;
          }

          setLoading(registerBtn, true, "Register");
          const res = await registerUser({
            username: regUsername.value.trim(),
            email: regEmail.value.trim(),
            password: regPassword.value,
            role: regRole.value,
          });
          setLoading(registerBtn, false, "Register");

          if (res.success) {
            // clear register form
            regUsername.value = "";
            regEmail.value = "";
            regPassword.value = "";
            regRole.value = "";

            // reset validation styles
            [regUsername, regEmail, regPassword, regRole].forEach((input) => {
              input.classList.remove("is-valid", "is-invalid");
            });
            showMessage(
              "Registered successfully! You can now sign in.",
              "success",
            );
            // auto-switch to login tab and prefill username
            tabs.forEach((t) =>
              t.classList.toggle("active", t.dataset.tab === "login"),
            );
            registerSection.classList.add("hidden");
            loginSection.classList.remove("hidden");
            loginUsername.value = regUsername.value.trim();
            loginPassword.focus();
          } else {
            showMessage(res.message || "Registration failed.", "error");
          }
        });

        // ── LOGIN ─────────────────────────────────────
        loginBtn.addEventListener("click", async () => {
          const u = loginUsername.value.trim();
          const p = loginPassword.value;

          // inline validation
          let ok = true;
          if (!u) {
            setError(
              loginUsername,
              "loginUsernameError",
              "Username is required",
            );
            ok = false;
          } else {
            clearErr(loginUsername, "loginUsernameError");
          }
          if (!p) {
            setError(
              loginPassword,
              "loginPasswordError",
              "Password is required",
            );
            ok = false;
          } else {
            clearErr(loginPassword, "loginPasswordError");
          }
          if (!ok) return;

          setLoading(loginBtn, true, "Sign In");
          const res = await loginUser({ username: u, password: p });
          setLoading(loginBtn, false, "Sign In");

          if (res.success) {
            showMessage("Signed in successfully!", "success");
            // clear login form
            loginUsername.value = "";
            loginPassword.value = "";

            [loginUsername, loginPassword].forEach((input) => {
              input.classList.remove("is-valid", "is-invalid");
            });
            await loadProfile();
          } else {
            showMessage(
              res.message || "Login failed. Check credentials.",
              "error",
            );
          }
        });

        // ── PROFILE ───────────────────────────────────
        async function loadProfile() {
          const res = await getCurrentUser();
          if (!res.success) {
            showMessage("Could not load profile.", "error");
            return;
          }

          const u = res.data;
          document.getElementById("profileName").textContent =
            u.username || "—";
          document.getElementById("profileRole").textContent = u.role || "—";
          document.getElementById("profileUsername").textContent =
            u.username || "—";
          document.getElementById("profileEmail").textContent = u.email || "—";
          document.getElementById("profileUserRole").textContent =
            u.role || "—";
          document.getElementById("profileVerified").textContent =
            u.isEmailVerified ? "✅ Yes" : "❌ No";
          document.getElementById("profileId").textContent = u._id || "—";
          document.getElementById("avatar").textContent = (u.username || "?")
            .charAt(0)
            .toUpperCase();

          // show profile, hide everything else
          registerSection.classList.add("hidden");
          loginSection.classList.add("hidden");
          profileSection.classList.remove("hidden");
          tabBar.classList.add("hidden"); // hide tabs while in profile view
        }

        // ── LOGOUT ────────────────────────────────────
        logoutBtn.addEventListener("click", async () => {
          setLoading(logoutBtn, true, "Logout");
          await logoutUser();
          setLoading(logoutBtn, false, "Logout");

          showMessage("Logged out successfully.", "success");

          // reset to register tab
          tabs.forEach((t) =>
            t.classList.toggle("active", t.dataset.tab === "register"),
          );
          profileSection.classList.add("hidden");
          loginSection.classList.add("hidden");
          registerSection.classList.remove("hidden");
          tabBar.classList.remove("hidden");

          // clear login fields
          loginUsername.value = "";
          loginPassword.value = "";
          [loginUsername, loginPassword].forEach((i) =>
            i.classList.remove("is-valid", "is-invalid"),
          );
        });
      });
    </script>
  </body>
</html>
